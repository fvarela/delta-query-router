[project]
name = "dqr"
version = "0.1.0"
description = "Delta Query Router: cost-aware routing of SQL queries between Databricks and Azure."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
