[project]
name = "dqr"
version = "0.1.0"
description = "Delta Query Router: cost-aware routing of SQL queries between Databricks and Azure."
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.164.0",
    "deltalake>=1.6.6",
    "duckdb>=2.0.0",
    "pyarrow>=26.0.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
dqr = "dqr.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls Azure or Databricks and can cost money; skipped by default",
]
addopts = "--strict-markers -m 'not integration'"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
